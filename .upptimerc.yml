owner: Boardzone-IR
repo: status
sites:
  - name: Site
    url: https://boardzone.ir/
    expectedStatusCodes: [200]
    maxResponseTime: 10000
  - name: API
    url: https://boardzone.ir/api/v1/healthz
    expectedStatusCodes: [200]
    maxResponseTime: 10000
status-website:
  name: وضعیت بردزون
  cname: status.boardzone.ir
  # Base theme for the variables boardzone.css doesn't set; the page is dark-only like the site.
  theme: dark
  # Files from assets/ are linked by absolute URL: the export crawls same-origin links and writes
  # each as a directory, which the later copy of assets/ then lands inside instead of replacing.
  logoUrl: https://status.boardzone.ir/icon.svg
  logoHref: https://boardzone.ir/
  faviconSvg: https://status.boardzone.ir/icon.svg
  favicon: https://status.boardzone.ir/icon-192.png
  # The published status page never sets lang/dir or lets theme-color be changed from config.
  customHeadHtml: >-
    <script>document.documentElement.lang="fa";document.documentElement.dir="rtl";var m=document.querySelector('meta[name="theme-color"]');if(m)m.content="#0b0f14";</script>
  introTitle: وضعیت سرویس‌های بردزون
  introMessage: این صفحه هر پنج دقیقه در دسترس بودن سایت و سرور بازی را بررسی می‌کند.
  navbar:
    - title: بردزون
      href: https://boardzone.ir/
  links:
    - rel: preconnect
      href: https://fonts.googleapis.com
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap
    - rel: stylesheet
      href: https://status.boardzone.ir/boardzone.css
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true
i18n:
  # Jalali calendar, Latin digits (uptime and response-time figures come from Upptime in Latin digits).
  locale: fa-IR-u-nu-latn
  # Same line as the site's footer (copyright in messages/fa.json); the Jalali year is static, so
  # it needs bumping at Nowruz.
  footer: © ۱۴۰۵ بردزون — تمامی حقوق محفوظ است.
  activeIncidents: رخدادهای فعال
  allSystemsOperational: همه‌ی سرویس‌ها کار می‌کنند
